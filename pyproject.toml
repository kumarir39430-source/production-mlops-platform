[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
mypy_path = "backend"
exclude = ["backend/alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]
