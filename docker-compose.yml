services:
  db:
    image: postgres:16-alpine
    container_name: modelops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-modelops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-modelops}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - modelops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: modelops-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: ${LOG_JSON:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # Inside Docker the database host is the service name "db", on its internal port 5432.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-modelops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-modelops}
    ports:
      - "8000:8000"

  # Development-style image (Vite dev server). A production build comes later (Phase 9/13).
  frontend:
    build: ./frontend
    container_name: modelops-frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"

  # MLflow tracking server: NOT IMPLEMENTED YET (added in Phase 6, containerized in Phase 9).

volumes:
  modelops_pgdata:
